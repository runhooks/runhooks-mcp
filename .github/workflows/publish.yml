name: Publish to npm & MCP Registry

# Publishes @runhooks/mcp to npm (with provenance) AND to the official MCP
# Registry whenever a version tag (v*) is pushed to the mirror repo. The release
# mirror pushes that tag only on a version bump, so this runs on bumps — never on
# ordinary commits.
#
# Both jobs check out the pushed tag, so the version they publish is pinned to
# that commit's package.json / server.json — never a stale or racing ref (this is
# what the old manual, dispatch-only registry step got wrong). The `registry` job
# `needs` the `npm` job, so the registry publish only happens after the matching
# npm version is live — which the registry requires to verify ownership via the
# package's `mcpName`.
#
# Both publishes are idempotent: npm skips if the version is already up, and the
# registry step treats an "already published" (duplicate) response as success —
# so re-running a tag is always safe.
#
# Auth is OIDC end-to-end — NO stored tokens:
#   - npm TRUSTED PUBLISHING. Configure once on npmjs.com for @runhooks/mcp:
#       Organization: runhooks · Repository: runhooks-mcp · Workflow: publish.yml
#     (matches on repo + workflow filename; the job name and workflow display
#      name below don't affect it). Provenance is attached automatically.
#   - MCP Registry via `mcp-publisher login github-oidc`, authorized for the
#     io.github.runhooks/* namespace because the repo lives under the runhooks org.
#
# This file is generated into the public mirror repo from the private Runhooks
# monorepo (mcp/scripts/mirror-publish.yml) — edit it there, not in the mirror.

on:
  push:
    tags:
      - 'v*'
  # Manual re-trigger from the Actions tab. Publishes whatever version is in
  # package.json / server.json on the selected ref (both publishes are idempotent).
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC: npm trusted publishing + MCP Registry auth

jobs:
  npm:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1; Node 22 still ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Skip if this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@runhooks/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@runhooks/mcp@$VERSION is already on npm — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, build, test
        if: steps.check.outputs.publish == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm test

      # No token: npm authenticates via OIDC against the trusted publisher config.
      # Provenance is attached automatically.
      - name: Publish (npm trusted publishing)
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public

  registry:
    # Only after the npm version is live — the registry verifies ownership by
    # reading the published package's `mcpName`.
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm can lag a few seconds behind a fresh publish; wait until the exact
      # version the registry is about to reference is actually served.
      - name: Wait for npm to serve this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "@runhooks/mcp@$VERSION" version >/dev/null 2>&1; then
              echo "npm is serving @runhooks/mcp@$VERSION"
              exit 0
            fi
            echo "waiting for npm to serve $VERSION ($i/30)…"
            sleep 5
          done
          echo "::error::npm did not serve $VERSION within the timeout"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - name: Validate manifest
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # Idempotent: a "duplicate version" response means this version is already
      # in the registry (e.g. a re-run) — treat that as success, not a failure.
      - name: Publish to the registry
        run: |
          set +e
          OUT=$(./mcp-publisher publish 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -qi "duplicate version"; then
              echo "::notice::This version is already in the MCP Registry — nothing to do."
              exit 0
            fi
            exit "$CODE"
          fi
