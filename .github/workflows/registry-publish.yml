name: Publish to MCP Registry (manual fallback)

# MANUAL FALLBACK. The normal path publishes the MCP Registry automatically from
# the `publish.yml` workflow on each version tag (npm first, then registry). Use
# this only to (re)publish the registry entry out of band — e.g. a version that
# reached npm but whose registry publish was missed.
#
# IMPORTANT: this publishes whatever `server.json` is on the ref you dispatch it
# against. Run it against the VERSION TAG (e.g. `v0.1.5`), not a branch, so the
# version is pinned — dispatching against a branch mid-release can publish a
# stale version (which the registry then rejects as a "duplicate").
#
# PREREQUISITE: the npm version in server.json must already be live on npm and
# carry a matching `mcpName` in package.json (the registry verifies ownership
# that way).
#
# Generated into the mirror from mcp/scripts/mcp-registry-publish.yml — edit it there.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC: authenticates to the MCP Registry for the io.github.runhooks namespace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - name: Validate manifest
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # Idempotent: a "duplicate version" response means this version is already
      # in the registry — treat that as success so re-runs are harmless.
      - name: Publish to the registry
        run: |
          set +e
          OUT=$(./mcp-publisher publish 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -qi "duplicate version"; then
              echo "::notice::This version is already in the MCP Registry — nothing to do."
              exit 0
            fi
            exit "$CODE"
          fi
